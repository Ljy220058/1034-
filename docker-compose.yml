services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      RUNNING_CLUB_DB_PATH: /data/running_club.db
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      UVICORN_WORKERS: 1
    volumes:
      - running_club_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cron-health:
    image: alpine:3.20
    depends_on:
      - web
    environment:
      HERMES_KANBAN_TASK: ${HERMES_KANBAN_TASK:-}
      HERMES_KANBAN_BOARD: ${HERMES_KANBAN_BOARD:-default}
      HEALTHCHECK_URL: http://web:8000/health
      CRON_HEALTH_INTERVAL_SECONDS: 300
    volumes:
      - ./scripts:/scripts:ro
    command: ["sh", "/scripts/cron-health.sh"]
    restart: unless-stopped

volumes:
  running_club_data:
