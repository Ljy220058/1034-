services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 1034-running-club:0.1.0
    container_name: 1034-running-club
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      RUNNING_CLUB_HOST: 0.0.0.0
      RUNNING_CLUB_PORT: "8000"
      RUNNING_CLUB_VERSION: "0.1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nwith urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5) as r:\n    raise SystemExit(0 if r.status == 200 else 1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: 1034-running-club-network

volumes:
  app-data:
