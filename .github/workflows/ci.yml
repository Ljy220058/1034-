name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Build Docker image
        run: docker build -t 1034-running-club:ci .

      - name: Start container
        run: |
          docker run -d --name 1034-running-club-ci -p 8000:8000 1034-running-club:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then
              exit 0
            fi
            sleep 2
          done
          docker logs 1034-running-club-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs 1034-running-club-ci
